<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Game Hub</title>

  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    .container {
      text-align: center;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 2rem;
      letter-spacing: 1px;
    }

    .app-grid {
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    .app-tile {
      width: 150px;
      padding: 20px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 18px;
      backdrop-filter: blur(10px);
      text-decoration: none;
      color: white;
      transition: transform 0.2s ease, background 0.2s ease;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }

    .app-tile:hover {
      transform: translateY(-6px);
      background: rgba(255, 255, 255, 0.15);
    }

    .icon {
      width: 70px;
      height: 70px;
      margin: 0 auto 10px;
      display: grid;
      gap: 3px;
    }

    /* Wordle/Scrabble-style icon */
    .wordle-icon {
      grid-template-columns: repeat(5, 1fr);
      grid-template-rows: repeat(5, 1fr);
    }

    .wordle-icon div {
      background: #22c55e;
      border-radius: 3px;
    }

    .wordle-icon div:nth-child(even) {
      background: #fbbf24;
    }

    /* Calculator icon */
    .calc-icon {
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(4, 1fr);
      padding: 5px;
    }

    .calc-icon div {
      background: rgba(255,255,255,0.85);
      border-radius: 4px;
    }

    .calc-icon .screen {
      grid-column: 1 / 4;
      background: #94a3b8;
    }

    .label {
      font-size: 1rem;
      font-weight: 600;
      margin-top: 8px;
    }

    .sub {
      font-size: 0.75rem;
      opacity: 0.7;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Game Hub</h1>

    <div class="app-grid">

      <!-- Wordle Pro -->
      <a class="app-tile" href="https://publisher2015.github.io/Wordle-Pro-/" target="_blank">
        <div class="icon wordle-icon">
          <div></div><div></div><div></div><div></div><div></div>
          <div></div><div></div><div></div><div></div><div></div>
          <div></div><div></div><div></div><div></div><div></div>
          <div></div><div></div><div></div><div></div><div></div>
          <div></div><div></div><div></div><div></div><div></div>
        </div>
        <div class="label">Wordle Pro</div>
        <div class="sub">Play now</div>
      </a>

      <!-- Calculator Pro -->
      <a class="app-tile" href="https://publisher2015.github.io/Calculator-Pro/" target="_blank">
        <div class="icon calc-icon">
          <div class="screen"></div>
          <div></div><div></div><div></div>
          <div></div><div></div><div></div>
          <div></div><div></div><div></div>
        </div>
        <div class="label">Calculator Pro</div>
        <div class="sub">Open calculator</div>
      </a>

    </div>
  </div>
</body>
</html>
