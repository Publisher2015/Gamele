
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f172a">
  <title>Game Hub</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 40px 20px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", Roboto, Arial, sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 1000px;
      text-align: center;
    }

    h1 {
      font-size: clamp(2rem, 5vw, 3rem);
      margin: 0 0 10px;
      letter-spacing: 1px;
    }

    .subtitle {
      color: #94a3b8;
      margin: 0 0 35px;
      font-size: 0.95rem;
    }

    .app-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(155px, 1fr));
      gap: 20px;
    }

    .app-tile {
      min-width: 0;
      padding: 24px 14px;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.13);
      border-radius: 18px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      text-decoration: none;
      color: white;
      transition: transform 0.2s ease, background 0.2s ease,
        border-color 0.2s ease;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 190px;
    }

    .app-tile:hover {
      transform: translateY(-6px);
      background: rgba(255, 255, 255, 0.13);
      border-color: rgba(255, 255, 255, 0.3);
    }

    .app-tile:focus-visible {
      outline: 3px solid #60a5fa;
      outline-offset: 4px;
    }

    .icon {
      width: 70px;
      height: 70px;
      margin: 0 auto 12px;
      flex-shrink: 0;
    }

    /* Wordle Pro */
    .wordle-icon {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      grid-template-rows: repeat(5, 1fr);
      gap: 3px;
    }

    .wordle-icon div {
      background: #22c55e;
      border-radius: 3px;
    }

    .wordle-icon div:nth-child(even) {
      background: #fbbf24;
    }

    .wordle-icon div:nth-child(3n) {
      background: #64748b;
    }

    /* Calculator Pro */
    .calc-icon {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: 1.2fr repeat(3, 1fr);
      gap: 4px;
      padding: 5px;
      border-radius: 10px;
      background: #475569;
    }

    .calc-icon div {
      background: #e2e8f0;
      border-radius: 4px;
    }

    .calc-icon .screen {
      grid-column: 1 / 4;
      background: #86efac;
    }

    /* Chatime */
    .chat-icon {
      border-radius: 20px;
      background: linear-gradient(145deg, #a78bfa, #6366f1);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: inset 0 0 0 2px rgba(255,255,255,.18);
    }

    .chat-icon svg {
      width: 46px;
      height: 46px;
    }

    /* Filament Cost Calculator */
    .filament-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 16px;
      background: linear-gradient(145deg, #fb923c, #ea580c);
      font-size: 43px;
      font-weight: 800;
    }

    /* DeskHub */
    .desk-icon {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 5px;
      padding: 7px;
      border-radius: 16px;
      background: #334155;
      border: 2px solid #64748b;
    }

    .desk-icon div {
      border-radius: 6px;
      background: #38bdf8;
    }

    .desk-icon div:nth-child(2) {
      background: #a78bfa;
    }

    .desk-icon div:nth-child(3) {
      background: #34d399;
    }

    .desk-icon div:nth-child(4) {
      background: #fbbf24;
    }

    .label {
      font-size: 1rem;
      font-weight: 650;
      margin-top: 3px;
    }

    .sub {
      font-size: 0.78rem;
      opacity: 0.7;
      margin-top: 5px;
    }

    footer {
      margin-top: 35px;
      font-size: 0.75rem;
      color: #64748b;
    }

    @media (max-width: 420px) {
      body {
        padding: 28px 14px;
      }

      .app-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 13px;
      }

      .app-tile {
        min-height: 175px;
        padding: 20px 8px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .app-tile {
        transition: none;
      }

      .app-tile:hover {
        transform: none;
      }
    }
  </style>
</head>

<body>
  <main class="container">
    <h1>🎮 Game Hub</h1>
    <p class="subtitle">All your favourite apps in one place.</p>

    <div class="app-grid">

      <!-- Wordle Pro -->
      <a class="app-tile"
         href="https://publisher2015.github.io/Wordle-Pro-/"
         target="_blank" rel="noopener noreferrer">
        <div class="icon wordle-icon" aria-hidden="true">
          <div></div><div></div><div></div><div></div><div></div>
          <div></div><div></div><div></div><div></div><div></div>
          <div></div><div></div><div></div><div></div><div></div>
          <div></div><div></div><div></div><div></div><div></div>
          <div></div><div></div><div></div><div></div><div></div>
        </div>
        <div class="label">Wordle Pro</div>
        <div class="sub">Play the word game</div>
      </a>

      <!-- Chatime -->
      <a class="app-tile"
         href="https://publisher2015.github.io/chatime/"
         target="_blank" rel="noopener noreferrer">
        <div class="icon chat-icon" aria-hidden="true">
          <svg viewBox="0 0 48 48" fill="none">
            <path d="M8 10 Q8 6 13 6 H35 Q40 6 40 11 V29 Q40 34 35 34 H23 L13 42 V34 H13 Q8 34 8 29 Z"
              fill="white"/>
            <circle cx="17" cy="20" r="2.5" fill="#6366f1"/>
            <circle cx="24" cy="20" r="2.5" fill="#6366f1"/>
            <circle cx="31" cy="20" r="2.5" fill="#6366f1"/>
          </svg>
        </div>
        <div class="label">Chatime</div>
        <div class="sub">Open your chat app</div>
      </a>

      <!-- Calculator Pro -->
      <a class="app-tile"
         href="https://publisher2015.github.io/Calculator-Pro/"
         target="_blank" rel="noopener noreferrer">
        <div class="icon calc-icon" aria-hidden="true">
          <div class="screen"></div>
          <div></div><div></div><div></div>
          <div></div><div></div><div></div>
          <div></div><div></div><div></div>
        </div>
        <div class="label">Calculator Pro</div>
        <div class="sub">Calculate anything</div>
      </a>

      <!-- Filament Cost Calculator -->
      <a class="app-tile"
         href="https://publisher2015.github.io/filamentcostcalculator/"
         target="_blank" rel="noopener noreferrer">
        <div class="icon filament-icon" aria-hidden="true">£</div>
        <div class="label">Filament Cost</div>
        <div class="sub">Calculate 3D print costs</div>
      </a>

      <!-- DeskHub -->
      <a class="app-tile"
         href="https://publisher2015.github.io/deskhub/"
         target="_blank" rel="noopener noreferrer">
        <div class="icon desk-icon" aria-hidden="true">
          <div></div><div></div><div></div><div></div>
        </div>
        <div class="label">DeskHub</div>
        <div class="sub">Open your desktop hub</div>
      </a>

    </div>

    <footer>Made for your projects · Game Hub</footer>
  </main>
</body>
</html>
